name: E2EKWOK
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - performance
      focus:
        type: string
      skip:
        type: string
      replicas:
        type: string
        default: "5"
permissions:
  contents: read
concurrency:
  group: e2e-kwok-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kwok:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'regression' && 240 || inputs.suite == 'performance' && 240 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Determine validation scope
        run: python .github/scripts/ci_changes.py
      - name: Validate bounded smoke scale before installing tools
        if: steps.changes.outputs.run_kwok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke')
        shell: bash
        env:
          KWOK_SCALE_REPLICAS: ${{ inputs.replicas || '5' }}
        run: python test/hack/kwok/smoke.py expected-nodes --replicas "${KWOK_SCALE_REPLICAS}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # This builds the KWOK/core test only; provider CI has its own run_go gate.
        if: steps.changes.outputs.run_kwok == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.changes.outputs.run_kwok == 'true'
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
          kubectl_version: v1.34.0
          cluster_name: karpenter-kwok-e2e
      - name: Record and validate KWOK Kubernetes baseline
        if: steps.changes.outputs.run_kwok == 'true'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .e2e/kwok
          kubectl version --output=json | tee .e2e/kwok/server-version.json
          go run ./test/hack/e2e/ackctl validate-versions \
            --versions "$(jq -c '[.serverVersion.gitVersion]' .e2e/kwok/server-version.json)"
      - name: Install ko
        if: steps.changes.outputs.run_kwok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GOFLAGS=-mod=mod go install github.com/google/ko@latest
      - name: Run KWOK e2e
        if: steps.changes.outputs.run_kwok == 'true'
        shell: bash
        env:
          KWOK_TEST_SUITE: ${{ inputs.suite || 'smoke' }}
          FOCUS: ${{ inputs.focus || '' }}
          SKIP: ${{ inputs.skip || '' }}
          KWOK_SCALE_REPLICAS: ${{ inputs.replicas || '5' }}
          KWOK_REPORT_DIR: .e2e/kwok
        run: |
          set -euo pipefail
          make kwok-core-e2e
      - name: Collect KWOK diagnostics
        if: always() && steps.changes.outputs.run_kwok == 'true'
        shell: bash
        env:
          KWOK_REPORT_DIR: .e2e/kwok
          KWOK_REPORT_PRESERVE: "true"
        run: bash test/hack/kwok/report.sh
      - name: Upload KWOK report
        if: always() && steps.changes.outputs.run_kwok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-kwok-report
          path: .e2e/kwok
