name: E2EParity
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: e2e-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Determine validation scope
        run: python .github/scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.run_go == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Check E2E parity
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make e2e-parity
