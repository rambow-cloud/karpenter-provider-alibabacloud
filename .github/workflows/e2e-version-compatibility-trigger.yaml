name: E2EVersionCompatibilityTrigger
on:
  workflow_dispatch:
    inputs:
      region:
        type: string
        default: cn-hangzhou
      cleanup:
        type: boolean
        default: true
      k8s_versions:
        type: string
        required: true
        description: 'JSON array of ACK versions confirmed available in the selected region (>=1.34); no automatic default'
permissions:
  contents: read
concurrency:
  group: e2e-version-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.validate.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - id: validate
        name: Validate confirmed ACK versions before cloud jobs
        shell: bash
        env:
          ACK_VERSIONS: ${{ inputs.k8s_versions }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .e2e
          go run ./test/hack/e2e/ackctl validate-versions --versions "${ACK_VERSIONS}" > .e2e/versions.json
          echo "versions=$(cat .e2e/versions.json)" >> "${GITHUB_OUTPUT}"
  version-compatibility:
    needs: version-preflight
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ${{ fromJSON(needs.version-preflight.outputs.versions) }}
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Integration
      region: ${{ inputs.region }}
      k8s_version: ${{ matrix.k8s_version }}
      cleanup: ${{ inputs.cleanup }}
      workflow_trigger: versionCompatibility
      source: alibabacloud
    secrets:
      ALIBABA_CLOUD_E2E_CONFIG: ${{ secrets.ALIBABA_CLOUD_E2E_CONFIG }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
