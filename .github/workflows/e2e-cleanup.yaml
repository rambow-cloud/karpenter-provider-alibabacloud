name: E2ECleanup
on:
  workflow_dispatch:
    inputs:
      deploy_config:
        type: string
        default: deploy-config.yaml
      manifest:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: e2e-cleanup-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/e2e/cleanup
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        with:
          deploy_config: ${{ inputs.deploy_config }}
          manifest: ${{ inputs.manifest }}
