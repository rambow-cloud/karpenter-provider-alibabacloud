name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CGO_ENABLED: '0'
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Determine validation scope
        run: python .github/scripts/ci_changes.py
      - name: Check change routing
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check GitHub workflow syntax without Go
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${tool_dir}"
          archive="${tool_dir}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -shellcheck=""
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.run_go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Helm
        if: steps.changes.outputs.run_go == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Set up Linux envtest
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make envtest-setup
          echo "KUBEBUILDER_ASSETS=$(bin/setup-envtest use 1.35.0 -p path)" >> "$GITHUB_ENV"
      - name: Unit and controller contract tests
        if: steps.changes.outputs.run_go == 'true'
        run: go test -p 2 ./pkg/... ./hack/... ./test/hack/... ./test/pkg/...
      - name: Controller contracts on minimum Kubernetes 1.34
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KUBEBUILDER_ASSETS="$(bin/setup-envtest use 1.34.0 -p path)" go test -p 2 ./pkg/controllers/...
      - name: Vet and build controller
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go vet -p 2 ./pkg/... ./cmd/...
          go build -p 2 -trimpath -o bin/controller ./cmd/controller
          GOARCH=arm64 go build -p 2 -trimpath -o bin/controller-arm64 ./cmd/controller
          for binary in bin/controller bin/controller-arm64; do
            go version -m "$binary" | grep -F 'CGO_ENABLED=0'
            if readelf --program-headers "$binary" | grep -q INTERP; then
              echo "Unexpected dynamic interpreter: $binary" >&2
              exit 1
            fi
            if readelf --dynamic "$binary" | grep -q NEEDED; then
              echo "Unexpected shared library dependency: $binary" >&2
              exit 1
            fi
          done
      - name: Compile cloud E2E harness without running it
        if: steps.changes.outputs.run_go == 'true'
        run: go test -p 1 -tags integration -run '^$' ./test/pkg/... ./test/suites/...
      - name: Check Helm and pinned deployment artifacts
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/karpenter --kube-version 1.34.0
          make compatibility
          make manifests
          git diff --exit-code -- charts/karpenter/crds pkg/apis/crds
      - name: Check formatting and dependency files
        if: steps.changes.outputs.run_go == 'true'
        env:
          COMPARE_RANGE: ${{ steps.changes.outputs.diff_range }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COMPARE_RANGE}" ]]; then
            mapfile -d '' -t files < <(git diff --name-only -z --no-renames --diff-filter=ACM "${COMPARE_RANGE}" -- '*.go')
          else
            mapfile -d '' -t files < <(git ls-files -z -- '*.go')
          fi
          if (( ${#files[@]} )); then
            test -z "$(gofmt -l "${files[@]}")"
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Go vulnerabilities in source and Linux binaries
        if: steps.changes.outputs.run_go == 'true'
        shell: bash
        env:
          GOMEMLIMIT: 2GiB
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          mkdir -p .e2e/security
          go run ./hack/security
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -version | tee .e2e/security/tool-version.txt
          govulncheck -scan=package -test -tags=integration ./... 2>&1 | tee .e2e/security/source.txt
          for binary in bin/controller bin/controller-arm64; do
            govulncheck -mode=binary "$binary" 2>&1 | tee ".e2e/security/$(basename "$binary").txt"
          done
      - name: Upload Go security scan reports
        if: always() && steps.changes.outputs.run_go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-security-reports
          path: .e2e/security
          if-no-files-found: ignore
