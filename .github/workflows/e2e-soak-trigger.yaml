name: E2ESoakTrigger
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: e2e-soak-${{ github.ref }}
  cancel-in-progress: false
jobs:
  soak:
    if: github.event_name == 'workflow_dispatch' && vars.ACK_E2E_ENABLED == 'true'
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: Integration
      region: cn-hangzhou
      workflow_trigger: soak
      cleanup: true
      source: alibabacloud
    secrets:
      ALIBABA_CLOUD_E2E_CONFIG: ${{ secrets.ALIBABA_CLOUD_E2E_CONFIG }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
