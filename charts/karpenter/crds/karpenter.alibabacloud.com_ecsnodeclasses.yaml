---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ecsnodeclasses.karpenter.alibabacloud.com
spec:
  group: karpenter.alibabacloud.com
  names:
    categories:
    - karpenter
    kind: ECSNodeClass
    listKind: ECSNodeClassList
    plural: ecsnodeclasses
    singular: ecsnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ECSNodeClass is the Schema for the ECSNodeClass API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ECSNodeClassSpec defines the desired state of ECSNodeClass
            properties:
              capacityReservationPreference:
                description: CapacityReservationPreference specifies the preference
                  for capacity reservations (open or target or none)
                type: string
              capacityReservationSelectorTerms:
                description: CapacityReservationSelectorTerms is a list of capacity
                  reservation selector requirements
                items:
                  description: CapacityReservationSelectorTerm defines selection logic
                    for Capacity Reservation
                  properties:
                    id:
                      description: ID is the capacity reservation ID
                      type: string
                    tags:
                      additionalProperties:
                        type: string
                      description: Tags is a map of tags to match
                      type: object
                  type: object
                type: array
              clusterEndpoint:
                description: ClusterEndpoint is the Kubernetes API server endpoint
                type: string
              clusterID:
                description: ClusterID is the ACK cluster ID
                type: string
              clusterName:
                description: ClusterName is the ACK cluster name
                type: string
              dataDisks:
                description: DataDisks specifies the data disk configuration
                items:
                  description: DataDiskSpec defines the data disk configuration
                  properties:
                    category:
                      description: Category is the disk type
                      enum:
                      - cloud_essd
                      - cloud_essd_entry
                      - cloud_efficiency
                      - cloud_pperf
                      - cloud_sperf
                      - cloud_ssd
                      - cloud_auto
                      - ephemeral_ssd
                      - cloud
                      - cloud_essd_xc0
                      - cloud_essd_xc1
                      - elastic_ephemeral_disk_premium
                      - elastic_ephemeral_disk_standard
                      type: string
                    deleteWithInstance:
                      default: true
                      description: DeleteWithInstance specifies whether to delete
                        with instance
                      type: boolean
                    device:
                      description: Device is the device name
                      type: string
                    encrypted:
                      description: Encrypted specifies whether the disk is encrypted
                      type: boolean
                    kmsKeyID:
                      description: KMSKeyID is the KMS key ID for encryption
                      type: string
                    performanceLevel:
                      description: PerformanceLevel is the ESSD performance level
                      enum:
                      - PL0
                      - PL1
                      - PL2
                      - PL3
                      type: string
                    size:
                      description: Size is the disk size in GB
                      format: int32
                      type: integer
                    snapshotID:
                      description: SnapshotID is the snapshot ID to create from
                      type: string
                  required:
                  - category
                  - size
                  type: object
                  x-kubernetes-validations:
                  - message: cloud_essd_xc1 is not supported
                    rule: self.category != 'cloud_essd_xc1'
                  - message: cloud_essd size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_essd' || (self.size >= 20 && self.size
                      <= 32768)
                  - message: cloud_essd_entry size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_essd_entry' || (self.size >= 20
                      && self.size <= 32768)
                  - message: cloud_efficiency size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_efficiency' || (self.size >= 20
                      && self.size <= 32768)
                  - message: cloud_pperf size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_pperf' || (self.size >= 20 && self.size
                      <= 32768)
                  - message: cloud_sperf size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_sperf' || (self.size >= 20 && self.size
                      <= 32768)
                  - message: cloud_ssd size must be between 20 and 32768 GB
                    rule: self.category != 'cloud_ssd' || (self.size >= 20 && self.size
                      <= 32768)
                  - message: cloud_auto size must be between 40 and 32768 GB
                    rule: self.category != 'cloud_auto' || (self.size >= 40 && self.size
                      <= 32768)
                  - message: ephemeral_ssd size must be between 5 and 800 GB
                    rule: self.category != 'ephemeral_ssd' || (self.size >= 5 && self.size
                      <= 800)
                  - message: cloud size must be between 5 and 2000 GB
                    rule: self.category != 'cloud' || (self.size >= 5 && self.size
                      <= 2000)
                  - message: cloud_essd_xc0 size must be between 40 and 2048 GB
                    rule: self.category != 'cloud_essd_xc0' || (self.size >= 40 &&
                      self.size <= 2048)
                  - message: elastic_ephemeral_disk_premium size must be between 64
                      and 8192 GB
                    rule: self.category != 'elastic_ephemeral_disk_premium' || (self.size
                      >= 64 && self.size <= 8192)
                  - message: elastic_ephemeral_disk_standard size must be between
                      64 and 8192 GB
                    rule: self.category != 'elastic_ephemeral_disk_standard' || (self.size
                      >= 64 && self.size <= 8192)
                  - message: performanceLevel is only supported for cloud_essd disks
                    rule: '!has(self.performanceLevel) || self.category == ''cloud_essd'''
                type: array
              imageCompatibilityPolicy:
                description: |-
                  ImageCompatibilityPolicy defaults to ACK. Custom permits only explicitly pinned
                  self/shared Linux images whose ACK compatibility has been verified by the user.
                enum:
                - ACK
                - Custom
                type: string
              imagePrerequisitesVerified:
                description: |-
                  ImagePrerequisitesVerified confirms user validation of prerequisites that
                  ACK/ECS metadata cannot prove, such as custom provenance and GPU/Ubuntu integration.
                  Known incompatibilities and hardware checks are never bypassed.
                type: boolean
              imageSelectorTerms:
                description: ImageSelectorTerms is a list of image selector requirements
                items:
                  description: ImageSelectorTerm defines selection logic for Image
                  properties:
                    id:
                      description: ID is the image ID
                      maxLength: 128
                      pattern: ^(m-[A-Za-z0-9._:-]{1,126}|[A-Za-z0-9][A-Za-z0-9._:-]{0,126}\.(vhd|qcow2))$
                      type: string
                    imageFamily:
                      description: Family is the image family (e.g. acs:alibaba_cloud_linux_3_2104_lts_x64)
                      maxLength: 128
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: image family must contain a non-whitespace character
                        rule: self.matches('[^[:space:]]')
                    imageOwnerAlias:
                      description: Alias is the image alias (system, self, others,
                        marketplace)
                      enum:
                      - system
                      - self
                      - others
                      - marketplace
                      type: string
                    imageOwnerID:
                      description: Owner is the account owning a shared image; requires
                        ImageOwnerAlias=others
                      maxLength: 19
                      pattern: ^[1-9][0-9]{5,18}$
                      type: string
                      x-kubernetes-validations:
                      - message: imageOwnerID must fit a positive int64
                        rule: size(self) < 19 || self <= '9223372036854775807'
                    name:
                      description: Name is the image name pattern
                      maxLength: 128
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: image name must contain a non-whitespace character
                        rule: self.matches('[^[:space:]]')
                    tags:
                      additionalProperties:
                        type: string
                      description: Tags is a map of tags to match
                      maxProperties: 20
                      type: object
                      x-kubernetes-validations:
                      - message: image tag keys and values must be non-empty
                        rule: self.all(k, size(k) > 0 && size(self[k]) > 0)
                  type: object
                  x-kubernetes-validations:
                  - message: image selector must specify id, imageFamily, imageOwnerAlias,
                      name, or non-empty tags
                    rule: has(self.id) || has(self.imageFamily) || has(self.imageOwnerAlias)
                      || has(self.name) || (has(self.tags) && size(self.tags) > 0)
                  - message: id is mutually exclusive with other image selectors
                    rule: '!has(self.id) || (!has(self.imageFamily) && !has(self.imageOwnerAlias)
                      && !has(self.imageOwnerID) && !has(self.name) && (!has(self.tags)
                      || size(self.tags) == 0))'
                  - message: imageOwnerID requires imageOwnerAlias=others (shared
                      images)
                    rule: '!has(self.imageOwnerID) || (has(self.imageOwnerAlias) &&
                      self.imageOwnerAlias == ''others'')'
                maxItems: 30
                minItems: 1
                type: array
              instanceStorePolicy:
                description: InstanceStorePolicy specifies local instance store handling.
                  P0 only validates the enum.
                type: string
              kubelet:
                description: Kubelet defines Kubelet configuration overrides
                properties:
                  clusterDNS:
                    description: ClusterDNS is a list of DNS server IP addresses
                    items:
                      type: string
                    type: array
                  cpuCFSQuota:
                    description: CPUCFSQuota enables CPU CFS quota enforcement
                    type: boolean
                  evictionHard:
                    additionalProperties:
                      type: string
                    description: EvictionHard contains eviction thresholds
                    type: object
                  evictionMaxPodGracePeriod:
                    description: EvictionMaxPodGracePeriod is the maximum grace period
                      for pod termination during eviction
                    format: int32
                    type: integer
                  evictionSoft:
                    additionalProperties:
                      type: string
                    description: EvictionSoft contains soft eviction thresholds
                    type: object
                  evictionSoftGracePeriod:
                    additionalProperties:
                      type: string
                    description: EvictionSoftGracePeriod contains grace periods for
                      soft eviction thresholds
                    type: object
                  imageGCHighThresholdPercent:
                    description: ImageGCHighThresholdPercent is the disk usage threshold
                      for high image garbage collection
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  imageGCLowThresholdPercent:
                    description: ImageGCLowThresholdPercent is the disk usage threshold
                      for low image garbage collection
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  kubeReserved:
                    additionalProperties:
                      type: string
                    description: KubeReserved contains resources reserved for Kubernetes
                      components
                    type: object
                  maxPods:
                    description: MaxPods is the maximum number of pods per node
                    format: int32
                    type: integer
                  podsPerCore:
                    description: |-
                      PodsPerCore enables pods per core scheduling
                      The maximum number of pods per node will be calculated as podsPerCore * number of cores
                    format: int32
                    type: integer
                  systemReserved:
                    additionalProperties:
                      type: string
                    description: SystemReserved contains resources reserved for system
                      daemons
                    type: object
                type: object
              launchTemplateID:
                description: LaunchTemplateID specifies the launch template ID to
                  use
                type: string
              launchTemplateVersion:
                description: LaunchTemplateVersion specifies the launch template version
                  to use
                format: int64
                type: integer
              metadataOptions:
                description: MetadataOptions specifies metadata service options
                properties:
                  httpEndpoint:
                    default: enabled
                    description: HttpEndpoint enables or disables the metadata service
                    enum:
                    - enabled
                    - disabled
                    type: string
                  httpPutResponseHopLimit:
                    default: 1
                    description: HttpPutResponseHopLimit specifies the hop limit for
                      instance metadata requests
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  httpTokens:
                    default: optional
                    description: HttpTokens specifies whether to require IMDSv2 (optional
                      or required)
                    enum:
                    - optional
                    - required
                    type: string
                type: object
              role:
                description: Role is the name of the RAM role to use for the instance
                type: string
              securityGroupSelectorTerms:
                description: SecurityGroupSelectorTerms is a list of security group
                  selector requirements
                items:
                  description: SecurityGroupSelectorTerm defines selection logic for
                    Security Group
                  properties:
                    id:
                      description: ID is the security group ID
                      type: string
                    name:
                      description: Name is the security group name
                      type: string
                    tags:
                      additionalProperties:
                        type: string
                      description: Tags is a map of tags to match
                      maxProperties: 20
                      type: object
                  type: object
                maxItems: 30
                minItems: 1
                type: array
              spotPriceLimit:
                description: SpotPriceLimit specifies the maximum hourly price for
                  spot instances
                type: number
              spotStrategy:
                description: SpotStrategy specifies the spot instance strategy (SpotAsPriceGo
                  or SpotWithPriceLimit)
                type: string
              systemDisk:
                description: SystemDisk specifies the system disk configuration
                properties:
                  category:
                    default: cloud_essd
                    description: Category is the disk type
                    enum:
                    - cloud_essd
                    - cloud_essd_entry
                    - cloud_efficiency
                    - cloud_pperf
                    - cloud_sperf
                    - cloud_ssd
                    - cloud_auto
                    - ephemeral_ssd
                    - cloud
                    - cloud_essd_xc0
                    - cloud_essd_xc1
                    - elastic_ephemeral_disk_premium
                    - elastic_ephemeral_disk_standard
                    type: string
                  encrypted:
                    description: Encrypted specifies whether the disk is encrypted
                    type: boolean
                  kmsKeyID:
                    description: KMSKeyID is the KMS key ID for encryption
                    type: string
                  performanceLevel:
                    description: PerformanceLevel is the ESSD performance level (PL0,
                      PL1, PL2, PL3)
                    enum:
                    - PL0
                    - PL1
                    - PL2
                    - PL3
                    type: string
                  size:
                    default: 40
                    description: Size is the disk size in GB
                    format: int32
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: cloud_essd_xc1 is not supported
                  rule: self.category != 'cloud_essd_xc1'
                - message: cloud_essd size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_essd'' || (self.size
                    >= 20 && self.size <= 32768)'
                - message: cloud_essd_entry size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_essd_entry''
                    || (self.size >= 20 && self.size <= 32768)'
                - message: cloud_efficiency size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_efficiency''
                    || (self.size >= 20 && self.size <= 32768)'
                - message: cloud_pperf size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_pperf'' || (self.size
                    >= 20 && self.size <= 32768)'
                - message: cloud_sperf size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_sperf'' || (self.size
                    >= 20 && self.size <= 32768)'
                - message: cloud_ssd size must be between 20 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_ssd'' || (self.size
                    >= 20 && self.size <= 32768)'
                - message: cloud_auto size must be between 40 and 32768 GB
                  rule: '!has(self.size) || self.category != ''cloud_auto'' || (self.size
                    >= 40 && self.size <= 32768)'
                - message: ephemeral_ssd size must be between 5 and 800 GB
                  rule: '!has(self.size) || self.category != ''ephemeral_ssd'' ||
                    (self.size >= 5 && self.size <= 800)'
                - message: cloud size must be between 5 and 2000 GB
                  rule: '!has(self.size) || self.category != ''cloud'' || (self.size
                    >= 5 && self.size <= 2000)'
                - message: cloud_essd_xc0 size must be between 40 and 2048 GB
                  rule: '!has(self.size) || self.category != ''cloud_essd_xc0'' ||
                    (self.size >= 40 && self.size <= 2048)'
                - message: elastic_ephemeral_disk_premium size must be between 64
                    and 8192 GB
                  rule: '!has(self.size) || self.category != ''elastic_ephemeral_disk_premium''
                    || (self.size >= 64 && self.size <= 8192)'
                - message: elastic_ephemeral_disk_standard size must be between 64
                    and 8192 GB
                  rule: '!has(self.size) || self.category != ''elastic_ephemeral_disk_standard''
                    || (self.size >= 64 && self.size <= 8192)'
                - message: performanceLevel is only supported for cloud_essd disks
                  rule: '!has(self.performanceLevel) || self.category == ''cloud_essd'''
              tags:
                additionalProperties:
                  type: string
                description: Tags are instance tags
                maxProperties: 64
                type: object
              userData:
                description: UserData specifies custom user data script
                type: string
              vSwitchSelectorTerms:
                description: VSwitchSelectorTerms is a list of VSwitch selector requirements
                items:
                  description: VSwitchSelectorTerm defines selection logic for VSwitch
                  properties:
                    id:
                      description: ID is the VSwitch ID
                      type: string
                    tags:
                      additionalProperties:
                        type: string
                      description: Tags is a map of tags to match
                      maxProperties: 20
                      type: object
                    zoneID:
                      description: ZoneID is the zone ID
                      type: string
                  type: object
                maxItems: 30
                minItems: 1
                type: array
            type: object
            x-kubernetes-validations:
            - message: spec.vSwitchSelectorTerms is required when launchTemplateID
                is not specified
              rule: has(self.launchTemplateID) || has(self.vSwitchSelectorTerms)
            - message: spec.securityGroupSelectorTerms is required when launchTemplateID
                is not specified
              rule: has(self.launchTemplateID) || has(self.securityGroupSelectorTerms)
            - message: spec.imageSelectorTerms is required when launchTemplateID is
                not specified
              rule: has(self.launchTemplateID) || has(self.imageSelectorTerms)
            - message: Custom image compatibility requires exact image IDs
              rule: '!has(self.imageCompatibilityPolicy) || self.imageCompatibilityPolicy
                != ''Custom'' || has(self.launchTemplateID) || (has(self.imageSelectorTerms)
                && self.imageSelectorTerms.all(t, has(t.id)))'
            - message: Custom images require explicit prerequisite verification
              rule: '!has(self.imageCompatibilityPolicy) || self.imageCompatibilityPolicy
                != ''Custom'' || (has(self.imagePrerequisitesVerified) && self.imagePrerequisitesVerified)'
          status:
            description: ECSNodeClassStatus defines the observed state of ECSNodeClass
            properties:
              conditions:
                description: Conditions contains the current conditions of the ECSNodeClass
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              images:
                description: Images contains the resolved image list
                items:
                  description: Image represents a resolved image
                  properties:
                    architecture:
                      description: Architecture is the image architecture
                      type: string
                    creationTime:
                      description: |-
                        CreationTime is the ECS RFC3339 creation timestamp. Missing or invalid
                        values have unknown age and rank after images with a valid timestamp.
                      type: string
                    id:
                      description: ID is the image ID
                      type: string
                    imageType:
                      description: ImageType is the ACK metadata image_type, when
                        ACK compatibility is verified.
                      type: string
                    name:
                      description: Name is the image name
                      type: string
                    osType:
                      description: OSType is obtained from ECS. This provider supports
                        Linux only.
                      type: string
                    ownerAlias:
                      description: OwnerAlias is the ECS image source for pricing.
                      type: string
                  required:
                  - id
                  type: object
                type: array
              launchTemplate:
                description: LaunchTemplate is the concrete version and disk layout
                  used by launch.
                properties:
                  disks:
                    description: NormalizedDisks is the canonical launch-affecting
                      disk state.
                    properties:
                      dataDisks:
                        items:
                          properties:
                            category:
                              type: string
                            deleteWithInstance:
                              type: boolean
                            device:
                              type: string
                            encrypted:
                              type: boolean
                            kmsKeyID:
                              type: string
                            performanceLevel:
                              type: string
                            size:
                              format: int32
                              type: integer
                            snapshotID:
                              type: string
                          required:
                          - category
                          - size
                          type: object
                        type: array
                      instanceStorePolicy:
                        type: string
                      systemDisk:
                        properties:
                          category:
                            type: string
                          encrypted:
                            type: boolean
                          kmsKeyID:
                            type: string
                          performanceLevel:
                            type: string
                          size:
                            format: int32
                            type: integer
                        required:
                        - category
                        - size
                        type: object
                    required:
                    - systemDisk
                    type: object
                  id:
                    type: string
                  instanceType:
                    type: string
                  pricing:
                    description: LaunchTemplatePricing records billable template settings
                      without credentials.
                    properties:
                      internetChargeType:
                        type: string
                      internetMaxBandwidthOut:
                        format: int32
                        type: integer
                      ioOptimized:
                        type: string
                      spotDuration:
                        format: int32
                        type: integer
                      unsupportedReason:
                        description: UnsupportedReason prevents quotes that omit inherited
                          billable settings.
                        type: string
                    type: object
                  version:
                    format: int64
                    type: integer
                required:
                - disks
                - id
                - version
                type: object
              ramRole:
                description: RAMRole is the resolved RAM role
                type: string
              ready:
                description: Ready indicates whether the ECSNodeClass is ready to
                  provision instances
                type: boolean
              securityGroups:
                description: SecurityGroups contains the resolved security group list
                items:
                  description: SecurityGroup represents a resolved security group
                  properties:
                    id:
                      description: ID is the security group ID
                      type: string
                    name:
                      description: Name is the security group name
                      type: string
                  required:
                  - id
                  type: object
                type: array
              vSwitches:
                description: VSwitches contains the resolved VSwitch list
                items:
                  description: VSwitch represents a resolved VSwitch
                  properties:
                    availableIPAddressCount:
                      description: AvailableIPAddressCount is the available IP address
                        count
                      type: integer
                    id:
                      description: ID is the VSwitch ID
                      type: string
                    zone:
                      description: Zone is the availability zone
                      type: string
                    zoneID:
                      description: ZoneID is the availability zone ID (alias for Zone)
                      type: string
                  required:
                  - id
                  - zone
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
