title: &siteTitle Alibaba Cloud Karpenter
baseURL: https://rambow-cloud.github.io/karpenter-provider-alibabacloud/
defaultContentLanguage: zh
enableRobotsTXT: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 社区维护的 Alibaba Cloud Karpenter provider，让阿里云节点弹性向 AWS Karpenter 的体验靠近。
  en:
    label: English
    locale: en-US
    weight: 2
    title: *siteTitle
    params:
      description: A community-maintained Alibaba Cloud Karpenter provider, working toward an AWS Karpenter-like node provisioning experience.

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  logo: icons/logo.svg
  github_repo: https://github.com/rambow-cloud/karpenter-provider-alibabacloud
  github_branch: main
  github_subdir: website
  copyright:
    authors: Rambow Cloud & project contributors
    from_year: 2026
  ui:
    dark_mode: true
    theme_color: '#16796f'
    typography: system
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.167.0
