sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: 社区维护 · Alibaba Cloud Provider
  title_lines:
    - words: [{ text: 让节点跟着负载走， }]
    - words: [{ text: 在阿里云也一样。 }]
  lead: 我们希望在阿里云获得类似 AWS Karpenter 的节点弹性体验。官方 provider 的持续维护与版本跟进尚未满足维护者的实际需求，这促成了本社区分支：继续修复问题、跟进 Karpenter，并用公开的验证记录推进项目。
  actions:
    - { label: 了解项目, url: docs/motivation/, icon: fa-solid fa-book-open, style: primary }
    - { label: 查看源码, url: 'https://github.com/rambow-cloud/karpenter-provider-alibabacloud', icon: fa-brands fa-github, style: ghost }

cards:
  eyebrow: 目标清楚，进度公开
  title: 从工作负载需求，到可用的 ECS 节点
  columns: 3
  items:
    - title: 用 Kubernetes 声明节点需求
      desc: NodePool 描述容量与调度约束，ECSNodeClass 描述镜像、交换机、安全组和磁盘。Provider 将这些需求连接到阿里云 ECS。
      icon: fa-solid fa-layer-group
      url: docs/motivation/
    - title: 把实现与验收分开
      desc: 当前 core 基线为 v1.14.1，chart 为 0.3.0-dev。离线和 KWOK 验证已经推进，真实 ACK 验收仍待完成。
      icon: fa-solid fa-clipboard-check
      url: docs/status/
    - title: 用 issue 推进持续维护
      desc: 版本兼容、生命周期修复、安全升级、最小 ACK E2E 和 Spot 中断分别规划，每项变更经过 feat 分支与 PR。
      icon: fa-solid fa-code-branch
      url: docs/participate/

cta:
  title: 一起把阿里云 provider 维护下去。
  text: 先了解当前状态和部署条件，再选择一个可验证的问题参与。AWS Karpenter 是我们参考的体验与工程方向，完整能力对齐仍是持续推进的目标。
  label: 上手与参与
  url: docs/participate/
  style: primary
