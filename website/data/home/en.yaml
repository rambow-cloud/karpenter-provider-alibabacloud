sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Community maintained · Alibaba Cloud Provider
  title_lines:
    - words: [{ text: Nodes that follow workloads. }]
    - words: [{ text: On Alibaba Cloud, too. }]
  lead: We want an AWS Karpenter-like node provisioning experience on Alibaba Cloud. The official provider's maintenance and version updates have not met the maintainer's needs. This community fork continues the work through fixes, upstream alignment, and public validation records.
  actions:
    - { label: Explore the project, url: docs/motivation/, icon: fa-solid fa-book-open, style: primary }
    - { label: View source, url: 'https://github.com/rambow-cloud/karpenter-provider-alibabacloud', icon: fa-brands fa-github, style: ghost }

cards:
  eyebrow: Clear goals. Visible progress.
  title: From workload requirements to an ECS node
  columns: 3
  items:
    - title: Declare requirements in Kubernetes
      desc: NodePool defines capacity and scheduling constraints. ECSNodeClass selects images, vSwitches, security groups, and disks. The provider connects these requirements to ECS.
      icon: fa-solid fa-layer-group
      url: docs/motivation/
    - title: Separate implementation from acceptance
      desc: The current core baseline is v1.14.1 with chart 0.3.0-dev. Offline and KWOK validation has progressed; real ACK release acceptance remains pending.
      icon: fa-solid fa-clipboard-check
      url: docs/status/
    - title: Maintain through issues and pull requests
      desc: Compatibility, lifecycle fixes, security upgrades, minimal ACK E2E, and Spot interruption each have a defined milestone and a reviewable delivery workflow.
      icon: fa-solid fa-code-branch
      url: docs/participate/

cta:
  title: Help keep the Alibaba Cloud provider moving.
  text: Start with the current status and deployment requirements, then contribute a verifiable change. AWS Karpenter informs the experience and engineering direction; complete feature parity remains a goal.
  label: Get started and contribute
  url: docs/participate/
  style: primary
